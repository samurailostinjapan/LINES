<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14181d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trail Mix">
<title>Trail Mix Consumption</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f3f5f7;
    --surface: #ffffff;
    --ink: #14181d;
    --muted: #5b6672;
    --line: #d5dbe1;
    --accent: #0d4f8b;
    --ok: #17683a;
    --ok-bg: #dcf1e3;
    --bad: #a3211b;
    --bad-bg: #fbe0dd;
    --field: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14181d;
      --surface: #1c2229;
      --ink: #eef1f4;
      --muted: #9aa5b1;
      --line: #333c46;
      --accent: #7db7ee;
      --ok: #7fd8a0;
      --ok-bg: #173826;
      --bad: #ff9c94;
      --bad-bg: #4a1d1a;
      --field: #12161b;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.4;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) 0 env(safe-area-inset-left, 0px);
  }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 20px 16px 190px;
  }
  h1 { font-size: 24px; line-height: 1.2; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { margin: 0 0 20px; color: var(--muted); font-size: 15px; }

  .product { padding: 18px 0 20px; border-top: 1px solid var(--line); }
  .product:first-of-type { border-top: 2px solid var(--ink); }
  .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
  .name { font-size: 18px; font-weight: 700; }
  .meta { color: var(--muted); font-size: 14px; white-space: nowrap; font-variant-numeric: tabular-nums; }

  .inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 4px; }
  input {
    width: 100%;
    font: inherit;
    font-size: 22px;
    font-variant-numeric: tabular-nums;
    padding: 12px 12px;
    color: var(--ink);
    background: var(--field);
    border: 1.5px solid var(--line);
    border-radius: 8px;
    min-height: 52px;
  }
  input:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  input.bad { border-color: var(--bad); }

  .result { margin-top: 14px; }
  .cons { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .cons .lbl { font-size: 15px; color: var(--muted); }
  .cons .val { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .cons .val small { font-size: 16px; font-weight: 500; color: var(--muted); margin-left: 4px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; font-variant-numeric: tabular-nums; }
  .stats div { font-size: 16px; font-weight: 600; }
  .stats span { display: block; font-size: 13px; font-weight: 400; color: var(--muted); }
  .flag { margin-top: 10px; padding: 8px 10px; border-radius: 6px; font-size: 15px; font-weight: 600; }
  .flag.ok { background: var(--ok-bg); color: var(--ok); }
  .flag.bad { background: var(--bad-bg); color: var(--bad); }

  .bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: var(--surface);
    border-top: 2px solid var(--ink);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  }
  .bar-inner { max-width: 560px; margin: 0 auto; }
  .bar .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .bar .lbl { font-size: 15px; color: var(--muted); }
  .bar .val { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .bar .val small { font-size: 17px; font-weight: 500; color: var(--muted); margin-left: 4px; }
  .bar .note { font-size: 14px; color: var(--muted); min-height: 20px; }
  .bar .note.bad { color: var(--bad); font-weight: 600; }
  .bar .note.ok { color: var(--ok); font-weight: 600; }
  .bar button {
    margin-top: 8px; font: inherit; font-size: 15px; color: var(--accent); background: none;
    border: 1.5px solid var(--line); border-radius: 8px; padding: 8px 14px; min-height: 40px;
  }
  .bar button:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
</style>
</head>
<body>
<main>
  <h1>Trail mix consumption</h1>
  <p class="sub">Enter pounds. Consumption is assigned minus remaining. The four consumptions add up to the finished output.</p>
  <div id="products"></div>
</main>

<div class="bar">
  <div class="bar-inner">
    <div class="row">
      <span class="lbl" id="totalLabel">Finished output</span>
      <span class="val" id="total">&ndash;</span>
    </div>
    <div class="note" id="note" aria-live="polite"></div>
    <button type="button" id="clear">Clear all</button>
  </div>
</div>

<script>
// ---- Settings you can edit ------------------------------------------------
// BOM percentages for SKU 8-00100 (TM PB CHOC PRTN WR), from work order 49216205.
const PRODUCTS = [
  { id: "pea", sku: "411-00014", name: "Jumbo peanut",  pct: 0.38 },
  { id: "pdr", sku: "407-00136", name: "Peanut drop",   pct: 0.25 },
  { id: "drk", sku: "407-00060", name: "Dark drop",     pct: 0.22 },
  { id: "coc", sku: "411-00073", name: "Cocoa glazed",  pct: 0.15 }
];
// Flag a product when its consumption is more than this far from theoretic (assumption: 5%).
const TOL = 0.05;
// ---------------------------------------------------------------------------

const STORE_KEY = "trailmix-counts-v1";
const $ = (id) => document.getElementById(id);
const fmt = (n) => n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pctFmt = (n) => (n * 100).toLocaleString("en-US", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + "%";

// Reads a text box. Returns {blank}, {bad}, or {n}.
function parse(v) {
  const s = String(v).replace(/,/g, "").trim();
  if (s === "") return { blank: true };
  const n = Number(s);
  return Number.isFinite(n) ? { n } : { bad: true };
}

// Pure calculation, given [{a: parsed, r: parsed}, ...] in PRODUCTS order.
function compute(counts) {
  const rows = PRODUCTS.map((p, i) => {
    const a = counts[i].a, r = counts[i].r;
    const complete = a.n !== undefined && r.n !== undefined;
    return { p, a, r, complete, cons: complete ? a.n - r.n : null };
  });
  const done = rows.filter((x) => x.complete);
  const total = done.reduce((s, x) => s + x.cons, 0);
  const allDone = done.length === rows.length;
  rows.forEach((x) => {
    x.theo = null; x.varLb = null; x.ratio = null; x.flags = [];
    if (x.complete && x.r.n > x.a.n) x.flags.push("Remaining is more than assigned");
    if (allDone && total > 0) {
      x.theo = total * x.p.pct;
      x.varLb = x.cons - x.theo;
      x.ratio = x.cons / x.theo;
      if (Math.abs(x.ratio - 1) > TOL) {
        x.flags.push(pctFmt(Math.abs(x.ratio - 1)) + (x.ratio > 1 ? " over" : " under") + " theoretic");
      }
    }
  });
  return { rows, total, allDone, doneCount: done.length };
}

// ---- Build the page --------------------------------------------------------
const holder = $("products");
PRODUCTS.forEach((p) => {
  const el = document.createElement("section");
  el.className = "product";
  el.innerHTML =
    '<div class="head"><span class="name">' + p.name + '</span>' +
    '<span class="meta">' + p.sku + ' &middot; BOM ' + Math.round(p.pct * 100) + '%</span></div>' +
    '<div class="inputs">' +
      '<div><label for="' + p.id + '-a">Assigned (lb)</label>' +
      '<input id="' + p.id + '-a" type="text" inputmode="decimal" autocomplete="off" enterkeyhint="next"></div>' +
      '<div><label for="' + p.id + '-r">Remaining (lb)</label>' +
      '<input id="' + p.id + '-r" type="text" inputmode="decimal" autocomplete="off" enterkeyhint="next"></div>' +
    '</div>' +
    '<div class="result" id="' + p.id + '-res" aria-live="polite"></div>';
  holder.appendChild(el);
});

function readCounts() {
  return PRODUCTS.map((p) => ({ a: parse($(p.id + "-a").value), r: parse($(p.id + "-r").value) }));
}

function render() {
  const out = compute(readCounts());
  out.rows.forEach((x) => {
    const id = x.p.id;
    $(id + "-a").classList.toggle("bad", !!x.a.bad);
    $(id + "-r").classList.toggle("bad", !!x.r.bad);
    const res = $(id + "-res");
    if (x.a.bad || x.r.bad) {
      res.innerHTML = '<div class="flag bad">Numbers only, for example 1250.5</div>';
      return;
    }
    if (!x.complete) { res.innerHTML = ""; return; }
    let h = '<div class="cons"><span class="lbl">Consumption (enter this)</span>' +
            '<span class="val">' + fmt(x.cons) + '<small>lb</small></span></div>';
    if (x.theo !== null) {
      h += '<div class="stats">' +
           '<div><span>Theoretic</span>' + fmt(x.theo) + '</div>' +
           '<div><span>Variance</span>' + fmt(x.varLb) + '</div>' +
           '<div><span>vs theoretic</span>' + pctFmt(x.ratio) + '</div></div>';
    }
    if (x.flags.length) {
      h += '<div class="flag bad">Check: ' + x.flags.join("; ") + '</div>';
    } else if (x.theo !== null) {
      h += '<div class="flag ok">OK</div>';
    }
    res.innerHTML = h;
  });

  const note = $("note");
  note.className = "note";
  if (out.allDone) {
    $("totalLabel").textContent = "Finished output";
    $("total").innerHTML = out.total > 0 ? fmt(out.total) + "<small>lb</small>" : "&ndash;";
    const bad = out.rows.some((x) => x.flags.length);
    if (out.total <= 0) { note.textContent = "Total is zero or negative. Check assigned and remaining."; note.classList.add("bad"); }
    else if (bad) { note.textContent = "Check the flagged products above."; note.classList.add("bad"); }
    else { note.textContent = "All products within " + Math.round(TOL * 100) + "% of theoretic."; note.classList.add("ok"); }
  } else {
    $("totalLabel").textContent = "Total so far";
    $("total").innerHTML = out.doneCount ? fmt(out.total) + "<small>lb</small>" : "&ndash;";
    note.textContent = (PRODUCTS.length - out.doneCount) + " of " + PRODUCTS.length + " products still need both counts.";
  }
}

// ---- Remember entries in case Safari reloads the page ----------------------
function save() {
  try {
    const data = {};
    PRODUCTS.forEach((p) => { data[p.id] = [$(p.id + "-a").value, $(p.id + "-r").value]; });
    localStorage.setItem(STORE_KEY, JSON.stringify(data));
  } catch (e) { /* storage unavailable: fine */ }
}
function load() {
  try {
    const data = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if (!data) return;
    PRODUCTS.forEach((p) => {
      if (data[p.id]) { $(p.id + "-a").value = data[p.id][0]; $(p.id + "-r").value = data[p.id][1]; }
    });
  } catch (e) { /* ignore */ }
}

document.addEventListener("input", () => { render(); save(); });
$("clear").addEventListener("click", () => {
  if (!confirm("Clear all counts?")) return;
  PRODUCTS.forEach((p) => { $(p.id + "-a").value = ""; $(p.id + "-r").value = ""; });
  render(); save();
  window.scrollTo(0, 0);
});

load();
render();

// Offline support (needs https, which GitHub Pages provides). Relative path so it works under /REPONAME/.
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
</script>
</body>
</html>
