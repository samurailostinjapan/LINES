<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14181d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trail Mix">
<title>Trail Mix Consumption</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f3f5f7; --surface: #ffffff; --ink: #14181d; --muted: #5b6672; --line: #d5dbe1;
    --accent: #0d4f8b; --ok: #17683a; --ok-bg: #dcf1e3; --bad: #a3211b; --bad-bg: #fbe0dd; --field: #ffffff;
    --warn: #7a4b00; --warn-bg: #fdf0d2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14181d; --surface: #1c2229; --ink: #eef1f4; --muted: #9aa5b1; --line: #333c46;
      --accent: #7db7ee; --ok: #7fd8a0; --ok-bg: #173826; --bad: #ff9c94; --bad-bg: #4a1d1a; --field: #12161b;
      --warn: #f3c969; --warn-bg: #3f3210;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 17px; line-height: 1.4;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) 0 env(safe-area-inset-left, 0px);
  }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 190px; }
  h1 { font-size: 24px; line-height: 1.2; margin: 0 0 12px; letter-spacing: -0.01em; }
  .sub { margin: 12px 0 16px; color: var(--muted); font-size: 15px; }

  label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 4px; }
  input, select {
    width: 100%; font: inherit; font-size: 22px; font-variant-numeric: tabular-nums;
    padding: 12px; color: var(--ink); background: var(--field);
    border: 1.5px solid var(--line); border-radius: 8px; min-height: 52px;
  }
  select { font-size: 18px; font-weight: 600; }
  input:focus-visible, select:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  input.bad { border-color: var(--bad); }

  details.setup { border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); margin-bottom: 18px; }
  details.setup summary { padding: 12px 14px; font-weight: 600; cursor: pointer; min-height: 48px; }
  details.setup .body { padding: 0 14px 14px; }
  .setup-note { font-size: 14px; color: var(--muted); margin: 0 0 10px; }
  .srow { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 10px; align-items: end; margin-bottom: 10px; }
  .srow .nm { font-weight: 600; font-size: 16px; padding-bottom: 14px; }
  .srow input { font-size: 18px; min-height: 46px; padding: 8px 10px; }
  .srow label { font-size: 12px; }
  .pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--warn-bg); color: var(--warn); margin-left: 8px; }

  .kits { padding: 16px 0 18px; border-top: 2px solid var(--ink); }
  .kits .t { font-size: 18px; font-weight: 700; }
  .kits .d { font-size: 14px; color: var(--muted); margin: 2px 0 10px; }
  .kits input { max-width: 200px; }

  .product { padding: 18px 0 20px; border-top: 1px solid var(--line); }
  .product:first-child { border-top: 2px solid var(--ink); }
  .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
  .name { font-size: 18px; font-weight: 700; }
  .meta { color: var(--muted); font-size: 14px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .inputs .full { grid-column: 1 / -1; }
  .breakdown { margin-top: 10px; font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .breakdown b { color: var(--ink); }

  .finished { padding: 18px 0 20px; border-top: 2px solid var(--ink); }
  .finished .t { font-size: 18px; font-weight: 700; }
  .finished .d { font-size: 14px; color: var(--muted); margin: 2px 0 12px; }
  .fin-lines { margin-top: 12px; font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .fin-lines b { color: var(--ink); }

  .result { margin-top: 12px; }
  .cons { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .cons .lbl { font-size: 15px; color: var(--muted); }
  .cons .val { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .cons .val small { font-size: 16px; font-weight: 500; color: var(--muted); margin-left: 4px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; font-variant-numeric: tabular-nums; }
  .stats div { font-size: 16px; font-weight: 600; }
  .stats span { display: block; font-size: 13px; font-weight: 400; color: var(--muted); }
  .flag { margin-top: 10px; padding: 8px 10px; border-radius: 6px; font-size: 15px; font-weight: 600; }
  .flag.ok { background: var(--ok-bg); color: var(--ok); }
  .flag.bad { background: var(--bad-bg); color: var(--bad); }
  .flag.warn { background: var(--warn-bg); color: var(--warn); }

  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 2px solid var(--ink);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); }
  .bar-inner { max-width: 560px; margin: 0 auto; }
  .bar .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .bar .lbl { font-size: 15px; color: var(--muted); }
  .bar .val { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .bar .val small { font-size: 17px; font-weight: 500; color: var(--muted); margin-left: 4px; }
  .bar .note { font-size: 14px; color: var(--muted); min-height: 20px; }
  .bar .note.bad { color: var(--bad); font-weight: 600; }
  .bar .note.ok { color: var(--ok); font-weight: 600; }
  .bar button { margin-top: 8px; font: inherit; font-size: 15px; color: var(--accent); background: none;
    border: 1.5px solid var(--line); border-radius: 8px; padding: 8px 14px; min-height: 40px; }
  .bar button:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
</style>
</head>
<body>
<main>
  <h1>Trail mix consumption</h1>
  <label for="line">Product</label>
  <select id="line"></select>
  <p class="sub" id="subText"></p>

  <details class="setup" id="setup">
    <summary>Setup: box weights and finished pack <span class="pill" id="setupPill" hidden>Needs setup</span></summary>
    <div class="body">
      <p class="setup-note">Set once per product. Saved on this phone.</p>
      <div id="setupRows"></div>
      <div class="srow"><div class="nm" id="finName">Finished pallet</div>
        <div><label for="pp" id="ppLabel">Units per pallet</label><input id="pp" type="text" inputmode="decimal" autocomplete="off"></div>
        <div><label for="bw" id="bwLabel">Lb per unit</label><input id="bw" type="text" inputmode="decimal" autocomplete="off"></div></div>
    </div>
  </details>

  <section class="kits" id="kitsSec">
    <div class="t">Premade kits remaining</div>
    <div class="d" id="kitDesc"></div>
    <label for="kits">Number of kits (like 6, not boxes). Type 0 if none.</label>
    <input id="kits" type="text" inputmode="decimal" autocomplete="off">
    <div id="kitWarn" aria-live="polite"></div>
  </section>

  <div id="products"></div>

  <section class="finished">
    <div class="t">Finished product check</div>
    <div class="d" id="finDesc"></div>
    <div class="inputs">
      <div><label for="fp">Full pallets finished</label><input id="fp" type="text" inputmode="decimal" autocomplete="off"></div>
      <div><label for="fr">Rework run today (lb, optional)</label><input id="fr" type="text" inputmode="decimal" autocomplete="off"></div>
      <div><label for="fs" id="fsLabel">On pallet at start</label><input id="fs" type="text" inputmode="decimal" autocomplete="off"></div>
      <div><label for="fe" id="feLabel">On pallet at end</label><input id="fe" type="text" inputmode="decimal" autocomplete="off"></div>
    </div>
    <div class="result" id="finRes" aria-live="polite"></div>
  </section>
</main>

<div class="bar">
  <div class="bar-inner">
    <div class="row">
      <span class="lbl" id="totalLabel">Finished output</span>
      <span class="val" id="total">&ndash;</span>
    </div>
    <div class="note" id="note" aria-live="polite"></div>
    <button type="button" id="clear">Clear all counts</button>
  </div>
</div>

<script>
// ---- Products you can edit ------------------------------------------------
// pct      = BOM percentage from the work order.
// perBox   = lb in one box of that ingredient.
// perKit   = boxes of that ingredient in one premade kit (only for lines that count kits).
// finished = what one finished unit weighs and how many make a pallet (perPallet: null = set it in Setup).
// Flag a product when its consumption is more than TOL away from theoretic (assumption: 5%).
// waste    = OK range for (consumed minus made from ingredients): either low/high in lb, or lowPct/highPct as a share of finished lb.
//            These are assumptions: tune after a few days.
const TOL = 0.05;
const CONFIGS = [
  {
    id: "8-00100", label: "8-00100  TM PB CHOC PRTN WR",
    useKits: true, useYamato: true, pallets: 1,
    sub: "Consumption = assigned \u2212 remaining. Remaining = pallet + kits + Yamato (+ loose lb). The consumptions add up to the finished output.",
    finished: { unit: "box", perPallet: 288, unitLb: 1.1 },
    waste: { low: -10, high: 75, expect: "30\u201350" },
    products: [
      { id: "pea", sku: "411-00014", name: "Jumbo peanut", pct: 0.38, perBox: 30, perKit: 16 },
      { id: "pdr", sku: "407-00136", name: "Peanut drop",  pct: 0.25, perBox: 25, perKit: 12 },
      { id: "drk", sku: "407-00060", name: "Dark drop",    pct: 0.22, perBox: 25, perKit: 11 },
      { id: "coc", sku: "411-00073", name: "Cocoa glazed", pct: 0.15, perBox: 40, perKit: 5 }
    ]
  },
  {
    id: "8-00072", label: "8-00072  TM PB CHOC WR",
    useKits: false, useYamato: false, pallets: 3,
    sub: "Consumption = assigned \u2212 remaining. Remaining = what is left on the 2\u20133 pallets around the mixer (boxes plus loose lb). The consumptions add up to the finished output.",
    finished: { unit: "tray", perPallet: 16, unitLb: 37.62 },   // 24 bags per tray; bag target 711 g = 1.5674 lb; x 24 = 37.62 lb (nominal 37.5 lb)
    waste: { lowPct: -0.005, highPct: 0.01 },   // placeholder: -0.5% to +1.0% of finished lb. Tune after a few days.
    products: [
      { id: "jmb", sku: "411-00014", name: "Jumbo peanut",        pct: 0.26, perBox: 30 },
      { id: "dk2", sku: "407-00060", name: "Dark drop",           pct: 0.22, perBox: 25 },
      { id: "alm", sku: "411-00044", name: "Cocoa dusted almond", pct: 0.22, perBox: 25 },
      { id: "pbc", sku: "407-00085", name: "PB cluster",          pct: 0.16, perBox: 25 },
      { id: "fdg", sku: "407-00086", name: "PB fudge cluster",    pct: 0.14, perBox: 25 }
    ]
  }
];
// ---------------------------------------------------------------------------

let cfg = CONFIGS[0];
let settled = true;   // false while typing, so checks do not flash on half-typed numbers
let settleTimer = null;
const SEL_KEY = "trailmix-line";
const countsKey = (id) => "trailmix-counts-v3:" + id;
const setupKey = (id) => "trailmix-setup-v2:" + id;
const LEGACY = { "8-00100": { counts: "trailmix-counts-v2", setup: "trailmix-setup-v1" } };

const $ = (id) => document.getElementById(id);
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const pl = (u) => (u === "box" ? "boxes" : u + "s");
const fmt = (n) => n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmt1 = (n) => n.toLocaleString("en-US", { maximumFractionDigits: 2 });
const pctFmt = (n) => (n * 100).toLocaleString("en-US", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + "%";

// Reads a text box. Returns {blank}, {bad}, or {n}. Negative numbers are rejected.
function parse(v) {
  const s = String(v).replace(/,/g, "").trim();
  if (s === "") return { blank: true };
  const n = Number(s);
  return Number.isFinite(n) && n >= 0 ? { n } : { bad: true };
}
const ZERO = { n: 0 };

// Pure calculation. state = { kits, rows: [{a, p, y, l, w, k}] } in cfg.products order (parsed values).
function compute(state, c) {
  const kits = state.kits;
  const rows = c.products.map((prod, i) => {
    const s = state.rows[i];
    const missing = [];
    if (s.a.n === undefined) missing.push("assigned");
    if (s.p.n === undefined) missing.push("pallet");
    if (c.useYamato && s.y.n === undefined) missing.push("Yamato");
    if (c.useKits && kits.n === undefined) missing.push("kits");
    if (!(s.w.n > 0)) missing.push("lb per box (Setup)");
    if (c.useKits && s.k.n === undefined) missing.push("boxes per kit (Setup)");
    const x = { p: prod, s, missing, ok: missing.length === 0,
                kitBoxes: 0, boxes: null, looseLb: 0, remLb: null, cons: null, theo: null, varLb: null, ratio: null, flags: [] };
    if (x.ok) {
      x.kitBoxes = c.useKits ? kits.n * s.k.n : 0;
      x.palletBoxes = s.p.n + (s.p2.n || 0) + (s.p3.n || 0);
      x.boxes = x.palletBoxes + x.kitBoxes + (c.useYamato ? s.y.n : 0);
      x.looseLb = s.l.n || 0;
      x.remLb = x.boxes * s.w.n + x.looseLb;
      x.cons = s.a.n - x.remLb;
      if (x.remLb > s.a.n) x.flags.push("Remaining is more than assigned");
    }
    return x;
  });
  const done = rows.filter((x) => x.ok);
  const total = done.reduce((t, x) => t + x.cons, 0);
  const allDone = done.length === rows.length;
  rows.forEach((x) => {
    if (x.ok && allDone && total > 0) {
      x.theo = total * x.p.pct;
      x.varLb = x.cons - x.theo;
      x.ratio = x.cons / x.theo;
      if (Math.abs(x.ratio - 1) > TOL) {
        x.flags.push(pctFmt(Math.abs(x.ratio - 1)) + (x.ratio > 1 ? " over" : " under") + " theoretic");
      }
    }
  });
  return { rows, total, allDone, doneCount: done.length };
}

// f = {fp, fs, fe, pp, bw, fr} parsed (fr = rework lb, optional). total = total consumed (lb) once all products are done.
function finishedCheck(f, total, allDone, c) {
  const u = c.finished.unit;
  const missing = [];
  if (f.fp.n === undefined) missing.push("full pallets");
  if (f.fs.n === undefined) missing.push(pl(u) + " at start");
  if (f.fe.n === undefined) missing.push(pl(u) + " at end");
  if (!(f.pp.n > 0)) missing.push(pl(u) + " per pallet (Setup)");
  if (!(f.bw.n > 0)) missing.push("lb per " + u + " (Setup)");
  if (missing.length) return { ok: false, missing };
  const units = f.fp.n * f.pp.n - f.fs.n + f.fe.n;
  const lb = units * f.bw.n;
  const rework = f.fr.n || 0;
  const r = { ok: true, units, lb, rework, ingLb: lb - rework, missing, waste: null, status: null };
  if (units < 0) { r.status = "bad"; r.msg = cap(pl(u)) + " made is negative. Check pallets and start/end counts."; return r; }
  r.lo = c.waste.lowPct != null ? c.waste.lowPct * r.ingLb : c.waste.low;
  r.hi = c.waste.highPct != null ? c.waste.highPct * r.ingLb : c.waste.high;
  if (allDone) {
    r.waste = total - r.ingLb;
    if (r.waste < r.lo) { r.status = "bad"; r.msg = "Consumed is less than finished product. Recount remaining or the pallet " + pl(u) + "."; }
    else if (r.waste > r.hi) { r.status = "bad"; r.msg = "More than " + fmt1(Math.round(r.hi)) + " lb difference. Recount remaining, or check pallet " + pl(u) + "."; }
    else { r.status = "ok"; r.msg = "OK"; }
  }
  return r;
}

// ---- Build the page for the selected product -------------------------------
function buildUI() {
  const u = cfg.finished.unit;
  $("subText").textContent = cfg.sub;
  $("kitsSec").hidden = !cfg.useKits;
  $("setupRows").innerHTML = cfg.products.map((p) =>
    '<div class="srow"><div class="nm">' + p.name + '</div>' +
    '<div><label for="' + p.id + '-w">Lb per box</label><input id="' + p.id + '-w" type="text" inputmode="decimal" autocomplete="off" value="' + p.perBox + '"></div>' +
    (cfg.useKits
      ? '<div><label for="' + p.id + '-k">Boxes per kit</label><input id="' + p.id + '-k" type="text" inputmode="decimal" autocomplete="off" value="' + p.perKit + '"></div>'
      : '<div></div>') +
    '</div>').join("");
  $("finName").textContent = "Finished pallet";
  $("ppLabel").textContent = cap(pl(u)) + " per pallet";
  $("bwLabel").textContent = "Lb per " + u;
  $("pp").value = cfg.finished.perPallet == null ? "" : cfg.finished.perPallet;
  $("bw").value = cfg.finished.unitLb;
  $("fsLabel").textContent = cap(pl(u)) + " on pallet at start";
  $("feLabel").textContent = cap(pl(u)) + " on pallet at end";
  $("finDesc").innerHTML = "A second way to check. " + cap(pl(u)) + " made = full pallets &times; " + pl(u) + " per pallet &minus; " + pl(u) +
    " already on the pallet at start + " + pl(u) + " on the pallet at end. Rework that was run again counts as finished product but was not consumed from the ingredients, so enter it too. Consumed minus finished should be just the waste.";
  ["fp", "fs", "fe", "fr", "kits"].forEach((id) => { $(id).value = ""; });

  const holder = $("products");
  holder.innerHTML = "";
  cfg.products.forEach((p) => {
    const el = document.createElement("section");
    el.className = "product";
    const multi = (cfg.pallets || 1) > 1;
    const cell = (suffix, label) => '<div><label for="' + p.id + '-' + suffix + '">' + label + '</label><input id="' + p.id + '-' + suffix + '" type="text" inputmode="decimal" autocomplete="off"></div>';
    const palletCells = multi
      ? cell("p", "Pallet 1 (boxes)") + cell("p2", "Pallet 2 (boxes, optional)") + cell("p3", "Pallet 3 (boxes, optional)")
      : cell("p", "On pallet (boxes)");
    const yam = cfg.useYamato
      ? '<div><label for="' + p.id + '-y">At Yamato (boxes)</label><input id="' + p.id + '-y" type="text" inputmode="decimal" autocomplete="off"></div>' : "";
    const loose = '<div><label for="' + p.id + '-l">Loose pounds (lb, optional)</label><input id="' + p.id + '-l" type="text" inputmode="decimal" autocomplete="off"></div>';
    el.innerHTML =
      '<div class="head"><span class="name">' + p.name + '</span><span class="meta">' + p.sku + ' &middot; BOM ' + Math.round(p.pct * 100) + '%</span></div>' +
      '<div class="inputs">' +
        '<div class="full"><label for="' + p.id + '-a">Assigned (lb)</label><input id="' + p.id + '-a" type="text" inputmode="decimal" autocomplete="off"></div>' +
        palletCells +
        (cfg.useYamato ? yam + loose : loose) +
      '</div><div class="result" id="' + p.id + '-res" aria-live="polite"></div>';
    holder.appendChild(el);
  });
}

function readState() {
  return {
    kits: cfg.useKits ? parse($("kits").value) : ZERO,
    rows: cfg.products.map((p) => ({
      a: parse($(p.id + "-a").value),
      p: parse($(p.id + "-p").value),
      p2: (cfg.pallets || 1) > 1 ? parse($(p.id + "-p2").value) : ZERO,
      p3: (cfg.pallets || 1) > 1 ? parse($(p.id + "-p3").value) : ZERO,
      y: cfg.useYamato ? parse($(p.id + "-y").value) : ZERO,
      l: parse($(p.id + "-l").value),
      w: parse($(p.id + "-w").value),
      k: cfg.useKits ? parse($(p.id + "-k").value) : ZERO
    }))
  };
}

function render() {
  const state = readState();
  const out = compute(state, cfg);
  const u = cfg.finished.unit;

  if (cfg.useKits) {
    $("kits").classList.toggle("bad", !!state.kits.bad);
    $("kitWarn").innerHTML = (state.kits.n > 20) ? '<div class="flag warn">That looks like boxes. Enter the number of kits (like 6).</div>' : "";
    $("kitDesc").textContent = "One kit = " + cfg.products.map((p, i) => {
      const k = state.rows[i].k; return (k.n !== undefined ? fmt1(k.n) : "?") + " " + p.name.toLowerCase();
    }).join(", ") + " (boxes).";
  }

  const f = { fp: parse($("fp").value), fs: parse($("fs").value), fe: parse($("fe").value),
              pp: parse($("pp").value), bw: parse($("bw").value), fr: parse($("fr").value) };
  const needsSetup = out.rows.some((x) => !(x.s.w.n > 0)) || !(f.pp.n > 0) || !(f.bw.n > 0);
  $("setupPill").hidden = !needsSetup;

  out.rows.forEach((x) => {
    const id = x.p.id, s = x.s;
    ["a", "p", "l", "w"].forEach((k) => $(id + "-" + k).classList.toggle("bad", !!s[k].bad));
    if (cfg.useYamato) $(id + "-y").classList.toggle("bad", !!s.y.bad);
    if ((cfg.pallets || 1) > 1) { $(id + "-p2").classList.toggle("bad", !!s.p2.bad); $(id + "-p3").classList.toggle("bad", !!s.p3.bad); }
    if (cfg.useKits) $(id + "-k").classList.toggle("bad", !!s.k.bad);
    const res = $(id + "-res");
    const anyBad = s.a.bad || s.p.bad || s.p2.bad || s.p3.bad || s.y.bad || s.l.bad || s.w.bad || s.k.bad || state.kits.bad;
    const touched = [s.a, s.p, s.p2, s.p3, s.y, s.l].some((v) => v && !v.blank && v !== ZERO);
    if (anyBad) { res.innerHTML = '<div class="flag bad">Numbers only, no negatives, for example 12.5</div>'; return; }
    if (!x.ok) {
      res.innerHTML = touched ? '<div class="flag warn">Still needed: ' + x.missing.join(", ") + '</div>' : "";
      return;
    }
    let parts;
    if ((cfg.pallets || 1) > 1) {
      const each = [s.p.n, s.p2.n || 0, s.p3.n || 0].filter((v, i) => i === 0 || v > 0);
      parts = 'pallets <b>' + fmt1(x.palletBoxes) + '</b>' + (each.length > 1 ? ' (' + each.map(fmt1).join(' + ') + ')' : '');
    } else {
      parts = 'pallet <b>' + fmt1(s.p.n) + '</b>';
    }
    if (cfg.useKits) parts += ' + kits <b>' + fmt1(x.kitBoxes) + '</b> (' + fmt1(state.kits.n) + ' &times; ' + fmt1(s.k.n) + ')';
    if (cfg.useYamato) parts += ' + Yamato <b>' + fmt1(s.y.n) + '</b>';
    let h = '<div class="breakdown">Remaining: ' + parts + ' = <b>' + fmt1(x.boxes) + '</b> boxes = ' + fmt(x.boxes * s.w.n) + ' lb' +
            (x.looseLb > 0 ? ' + loose <b>' + fmt1(x.looseLb) + ' lb</b>' : '') + ' = <b>' + fmt(x.remLb) + ' lb</b></div>';
    h += '<div class="cons" style="margin-top:10px"><span class="lbl">Consumption (enter this)</span>' +
         '<span class="val">' + fmt(x.cons) + '<small>lb</small></span></div>';
    if (x.theo !== null) {
      h += '<div class="stats">' +
           '<div><span>Theoretic</span>' + fmt(x.theo) + '</div>' +
           '<div><span>Variance</span>' + fmt(x.varLb) + '</div>' +
           '<div><span>vs theoretic</span>' + pctFmt(x.ratio) + '</div></div>';
    }
    if (settled) {
      if (x.flags.length) h += '<div class="flag bad">Check: ' + x.flags.join("; ") + '</div>';
      else if (x.theo !== null) h += '<div class="flag ok">OK</div>';
    }
    res.innerHTML = h;
  });

  ["fp", "fs", "fe", "pp", "bw", "fr"].forEach((k) => $(k).classList.toggle("bad", !!f[k].bad));
  const fin = finishedCheck(f, out.total, out.allDone, cfg);
  const finRes = $("finRes");
  if (["fp", "fs", "fe", "pp", "bw", "fr"].some((k) => f[k].bad)) {
    finRes.innerHTML = '<div class="flag bad">Numbers only, no negatives, for example 20</div>';
  } else if (!fin.ok) {
    const touched = ["fp", "fs", "fe"].some((k) => !f[k].blank);
    finRes.innerHTML = touched ? '<div class="flag warn">Still needed: ' + fin.missing.join(", ") + ' (type 0 if none)</div>' : "";
  } else {
    let t = '<div class="fin-lines">Finished: ' + fmt1(f.fp.n) + ' &times; ' + fmt1(f.pp.n) + ' &minus; ' + fmt1(f.fs.n) + ' + ' + fmt1(f.fe.n) +
            ' = <b>' + fmt1(fin.units) + '</b> ' + pl(u) + ' &times; ' + fmt1(f.bw.n) + ' lb = <b>' + fmt(fin.lb) + ' lb</b>';
    if (fin.rework > 0) t += '<br>Minus rework run: <b>' + fmt(fin.rework) + ' lb</b> = <b>' + fmt(fin.ingLb) + ' lb</b> made from ingredients';
    if (fin.waste !== null) {
      t += '<br>Consumed (total above): <b>' + fmt(out.total) + ' lb</b>' +
           '<br>Consumed minus finished: <b>' + fmt(fin.waste) + ' lb</b> (' + (cfg.waste.expect ? 'expected ' + cfg.waste.expect : 'OK range ' + fmt1(Math.round(fin.lo)) + ' to ' + fmt1(Math.round(fin.hi)) + ' lb') + ')';
    } else {
      t += '<br>Waiting for all product counts above to compare.';
    }
    t += '</div>';
    if (settled && fin.status) t += '<div class="flag ' + (fin.status === "ok" ? "ok" : "bad") + '">' + (fin.status === "ok" ? "OK" : "Check: " + fin.msg) + '</div>';
    finRes.innerHTML = t;
  }

  const note = $("note");
  note.className = "note";
  if (!settled) {
    $("totalLabel").textContent = out.allDone ? "Finished output" : "Total so far";
    $("total").innerHTML = out.doneCount ? fmt(out.total) + "<small>lb</small>" : "&ndash;";
    note.textContent = "Checks run when you stop typing.";
  } else if (out.allDone) {
    $("totalLabel").textContent = "Finished output";
    $("total").innerHTML = out.total > 0 ? fmt(out.total) + "<small>lb</small>" : "&ndash;";
    const bad = out.rows.some((x) => x.flags.length);
    if (out.total <= 0) { note.textContent = "Total is zero or negative. Check assigned and remaining."; note.classList.add("bad"); }
    else if (bad) { note.textContent = "Check the flagged products above."; note.classList.add("bad"); }
    else if (fin.status === "bad") { note.textContent = "Products OK, but check the finished product count."; note.classList.add("bad"); }
    else {
      note.textContent = "All products within " + Math.round(TOL * 100) + "% of theoretic." + (fin.status === "ok" ? " Finished check OK." : " Finished check not entered.");
      note.classList.add("ok");
    }
  } else {
    $("totalLabel").textContent = "Total so far";
    $("total").innerHTML = out.doneCount ? fmt(out.total) + "<small>lb</small>" : "&ndash;";
    note.textContent = (cfg.products.length - out.doneCount) + " of " + cfg.products.length + " products still need all counts.";
  }
}

// ---- Remember entries in case Safari reloads the page ----------------------
function save() {
  try {
    const c = { kits: $("kits").value, fin: [$("fp").value, $("fs").value, $("fe").value, $("fr").value] };
    const s = { pallet: [$("pp").value, $("bw").value] };
    cfg.products.forEach((p) => {
      c[p.id] = [$(p.id + "-a").value, $(p.id + "-p").value, cfg.useYamato ? $(p.id + "-y").value : "", $(p.id + "-l").value,
                 (cfg.pallets || 1) > 1 ? $(p.id + "-p2").value : "", (cfg.pallets || 1) > 1 ? $(p.id + "-p3").value : ""];
      s[p.id] = [$(p.id + "-w").value, cfg.useKits ? $(p.id + "-k").value : ""];
    });
    localStorage.setItem(countsKey(cfg.id), JSON.stringify(c));
    localStorage.setItem(setupKey(cfg.id), JSON.stringify(s));
  } catch (e) { /* storage unavailable: fine */ }
}
function readJSON(key) { try { return JSON.parse(localStorage.getItem(key) || "null"); } catch (e) { return null; } }
function load() {
  const leg = LEGACY[cfg.id] || {};
  const c = readJSON(countsKey(cfg.id)) || (leg.counts ? readJSON(leg.counts) : null);
  const s = readJSON(setupKey(cfg.id)) || (leg.setup ? readJSON(leg.setup) : null);
  if (c) {
    if (cfg.useKits) $("kits").value = c.kits || "";
    if (c.fin) { $("fp").value = c.fin[0] || ""; $("fs").value = c.fin[1] || ""; $("fe").value = c.fin[2] || ""; $("fr").value = c.fin[3] || ""; }
    cfg.products.forEach((p) => {
      const v = c[p.id]; if (!v) return;
      $(p.id + "-a").value = v[0] || ""; $(p.id + "-p").value = v[1] || "";
      if (cfg.useYamato) $(p.id + "-y").value = v[2] || "";
      $(p.id + "-l").value = v[3] || "";
      if ((cfg.pallets || 1) > 1) { $(p.id + "-p2").value = v[4] || ""; $(p.id + "-p3").value = v[5] || ""; }
    });
  }
  if (s) {
    if (s.pallet) { if (s.pallet[0] !== "") $("pp").value = s.pallet[0]; if (s.pallet[1] !== "") $("bw").value = s.pallet[1]; }
    cfg.products.forEach((p) => {
      const v = s[p.id]; if (!v) return;
      if (v[0] !== "") $(p.id + "-w").value = v[0];
      if (cfg.useKits && v[1] !== "") $(p.id + "-k").value = v[1];
    });
  }
}
function setupComplete() {
  const f = { pp: parse($("pp").value), bw: parse($("bw").value) };
  return cfg.products.every((p) => parse($(p.id + "-w").value).n > 0) && f.pp.n > 0 && f.bw.n > 0;
}

function switchTo(id) {
  cfg = CONFIGS.find((c) => c.id === id) || CONFIGS[0];
  try { localStorage.setItem(SEL_KEY, cfg.id); } catch (e) {}
  $("line").value = cfg.id;
  buildUI(); load(); settled = true; render();
  $("setup").open = !setupComplete();
  window.scrollTo(0, 0);
}

$("line").innerHTML = CONFIGS.map((c) => '<option value="' + c.id + '">' + c.label + '</option>').join("");
$("line").addEventListener("change", (e) => { save(); switchTo(e.target.value); });

document.addEventListener("input", (e) => {
  if (e.target.id === "line") return;
  settled = false; render(); save();
  clearTimeout(settleTimer);
  settleTimer = setTimeout(() => { settled = true; render(); }, 900);
});
$("clear").addEventListener("click", () => {
  if (!confirm("Clear all counts? (Box weights and pack sizes are kept.)")) return;
  ["kits", "fp", "fs", "fe", "fr"].forEach((id) => { $(id).value = ""; });
  cfg.products.forEach((p) => {
    ["a", "p", "l"].concat(cfg.useYamato ? ["y"] : [], (cfg.pallets || 1) > 1 ? ["p2", "p3"] : []).forEach((k) => { $(p.id + "-" + k).value = ""; });
  });
  settled = true; render(); save();
  window.scrollTo(0, 0);
});

let startId = CONFIGS[0].id;
try { startId = localStorage.getItem(SEL_KEY) || startId; } catch (e) {}
switchTo(startId);

// Offline support (needs https, which GitHub Pages provides). Relative path so it works under /REPONAME/.
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
</script>
